<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Archive Random Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 40px;
            word-break: break-all;
        }
        .loader {
            border: 3px solid #333;
            border-top: 3px solid #0078d4;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>IA Random Downloader</h1>
    <button id="fetch-btn">ランダムファイルをダウンロード</button>
    <div class="loader" id="loader"></div>
    <div id="status">ボタンを押すと、インターネットアーカイブからランダムにファイルを探してダウンロードします。</div>
</div>

<script>
    const button = document.getElementById('fetch-btn');
    const statusDiv = document.getElementById('status');
    const loader = document.getElementById('loader');

    button.addEventListener('click', async () => {
        button.disabled = true;
        loader.style.display = 'block';
        statusDiv.innerText = 'アイテムを検索中...';

        try {
            const randomPage = Math.floor(Math.random() * 100) + 1;
            const searchUrl = `https://advancedsearch.archive.org/advancedsearch.php?q=mediatype%3A(software+OR+texts+OR+data)&fl[]=identifier&sort[]=downloads+desc&rows=50&page=${randomPage}&output=json`;
            
            const searchResponse = await fetch(searchUrl);
            const searchData = await searchResponse.json();
            const docs = searchData.response.docs;

            if (!docs || docs.length === 0) {
                throw new Error('アイテムの取得に失敗しました。再試行してください。');
            }

            const randomDoc = docs[Math.floor(Math.random() * docs.length)];
            const identifier = randomDoc.identifier;

            statusDiv.innerText = `ファイル一覧を取得中: ${identifier}`;

            const metadataUrl = `https://archive.org/metadata/${identifier}`;
            const metadataResponse = await fetch(metadataUrl);
            const metadataData = await metadataResponse.json();
            const files = metadataData.files;

            if (!files || files.length === 0) {
                throw new Error('ファイルが見つかりませんでした。');
            }

            const validFiles = files.filter(f => 
                f.name && 
                !f.name.endsWith('.xml') && 
                !f.name.endsWith('.sqlite') && 
                !f.name.endsWith('.torrent')
            );

            if (validFiles.length === 0) {
                throw new Error('ダウンロード可能なファイルが見つかりませんでした。');
            }

            const randomFile = validFiles[Math.floor(Math.random() * validFiles.length)];
            const downloadUrl = `https://archive.org/download/${identifier}/${randomFile.name}`;

            statusDiv.innerHTML = `ダウンロードを開始します:<br><span style="color:#0078d4;">${randomFile.name}</span>`;
            
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = randomFile.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

        } catch (error) {
            statusDiv.innerText = `エラー: ${error.message}`;
        } finally {
            button.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
