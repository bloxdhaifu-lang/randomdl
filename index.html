<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アーカイブ ランダムダウンローダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: #8b949e;
      font-size: 0.95rem;
    }

    .main-btn {
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(46, 160, 67, 0.3);
    }

    .main-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(46, 160, 67, 0.45);
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #result-card {
      display: none;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      max-width: 680px;
      width: 100%;
      margin-top: 32px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .badge-texts   { background: #1f3a5f; color: #58a6ff; }
    .badge-audio   { background: #3a1f5f; color: #bc8cff; }
    .badge-movies  { background: #3a2a00; color: #e3b341; }
    .badge-software{ background: #1f3a2a; color: #3fb950; }
    .badge-image   { background: #3a1f2a; color: #ff7b72; }
    .badge-etree   { background: #2a1f3a; color: #d2a8ff; }
    .badge-data    { background: #1f3a3a; color: #39d353; }
    .badge-web     { background: #3a2a1f; color: #ffa657; }

    .item-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-meta {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .item-meta span { margin-right: 16px; }

    .item-description {
      background: #0d1117;
      border-left: 3px solid #30363d;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 20px;
      max-height: 100px;
      overflow: hidden;
    }

    .dl-status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #3fb950;
      font-weight: 600;
    }

    #error-box {
      display: none;
      background: #2a0e14;
      border: 1px solid #6e2a2a;
      border-radius: 10px;
      padding: 16px 20px;
      color: #ff7b72;
      font-size: 0.9rem;
      margin-top: 20px;
      max-width: 480px;
      width: 100%;
    }

    footer {
      margin-top: 48px;
      color: #484f58;
      font-size: 0.8rem;
      text-align: center;
    }

    footer a { color: #58a6ff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>🎲 アーカイブ ランダムダウンローダー</h1>
  <p>Internet Archiveから毎回ランダムなファイルを見つけてダウンロード</p>
</header>

<button class="main-btn" id="spinBtn" onclick="fetchRandom()">
  🎲 ランダムに探す
</button>

<div id="error-box"></div>

<div id="result-card">
  <span class="badge" id="badge"></span>
  <div class="item-title" id="item-title"></div>
  <div class="item-meta" id="item-meta"></div>
  <div class="item-description" id="item-desc"></div>
  <div class="dl-status">⬇ ダウンロードを開始しました</div>
</div>

<footer>
  データは <a href="https://archive.org" target="_blank">Internet Archive</a> から取得しています
</footer>

<script>
  const MEDIA_LABELS = {
    texts: '📄 テキスト',
    audio: '🎵 オーディオ',
    movies: '🎬 映像',
    software: '💾 ソフトウェア',
    image: '🖼 画像',
    etree: '🎸 ライブ音源',
    data: '📊 データ',
    web: '🕸 Webアーカイブ'
  };

  async function fetchRandom() {
    const btn = document.getElementById('spinBtn');
    const card = document.getElementById('result-card');
    const errBox = document.getElementById('error-box');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>検索中...';
    card.style.display = 'none';
    errBox.style.display = 'none';

    try {
      const res = await fetch('/api/random');
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'エラーが発生しました');
      }

      const a = document.createElement('a');
      a.href = data.proxyUrl;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      const badge = document.getElementById('badge');
      badge.textContent = MEDIA_LABELS[data.mediaType] || data.mediaType;
      badge.className = 'badge badge-' + data.mediaType;

      document.getElementById('item-title').textContent = data.title;
      document.getElementById('item-meta').innerHTML =
        `<span>👤 ${data.creator}</span><span>📅 ${data.year}</span>`;
      document.getElementById('item-desc').textContent = data.description;

      card.style.display = 'block';
    } catch (err) {
      errBox.textContent = '❌ ' + err.message + ' — もう一度試してください';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🎲 もう一度探す';
    }
  }
</script>
</body>
</html>
